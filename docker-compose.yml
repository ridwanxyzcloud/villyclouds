services:
  villyclouds:
    build: .
    container_name: villyclouds
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    networks:
      - edge
      - default
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5

networks:
  edge:
    external: true
